site_name: Idk
site_description: No description
site_author: Ehud Eden

site_url: https://ShadowEd0.github.io/Idk/

repo_name: EhudEden/Idk
repo_url: https://github.com/ShadowEd0/Idk.git

# 2. THÈME ET APPARENCE
theme:
  name: material
  custom_dir: overrides        # Templates personnalisés (voir overrides/main.html)
  language: fr                  # Interface en français (boutons, recherche...)
  palette:
    # Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan           # Couleur principale (barre du haut)
      accent: pink            # Couleur d'accentuation (liens, boutons)
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair

  exclude_docs:
    - index.md
    - cryptographie.md
    - real.md
  
  features:
    - navigation.tabs           # Menu sous forme d'onglets en haut
    - navigation.top            # Bouton fléché pour remonter en haut de page
    - search.suggest            # Suggestions automatiques dans la barre de recherche
    - search.highlight          # Surligne le texte cherché sur la page
    - content.code.copy         # Ajoute un bouton "Copier" sur tous les blocs de code

# 3. EXTENSIONS MARKDOWN (Fonctionnalités avancées)
markdown_extensions:
  - footnotes
  - admonition                  # Permet de faire des blocs d'avertissement/notes (!!! note)
  - pymdownx.details            # Permet de faire des blocs dépliables (??? note)
  - pymdownx.superfences        # Support des blocs de code avancés
  - pymdownx.highlight:         # Coloration du code
      anchor_linenums: true
  - toc:
      permalink: true        # Ajoute un symbole de lien au survol des titres
  - pymdownx.tasklist:
      custom_checkbox: true   # Rendu visuel propre des cases
      clickable_checkbox: true # Permet de cliquer sur les cases côté client (si supporté par le thème)
# 4. STRUCTURE ET MENU DU SITE
nav:
  - Accueil: av_rentre.md # index.md
  # - Cryptographie: cryptographie.md
  # - Sujet réel: real.md
  - Note à l'utilisatrice: note_user.md
  - Mises à jour: mises_à_jour.md

# 5. ANALYTICS (Google Analytics 4)
# Measurement ID de la propriété GA4 (visible dans le HTML du site, ce n'est pas un secret).
# La variable d'environnement GA_MEASUREMENT_ID permet de le remplacer au build, utile
# si un jour le build est fait sur une autre machine ou en CI :
#   PowerShell :  $env:GA_MEASUREMENT_ID = "G-XXXXXXXXXX" ; mkdocs gh-deploy
#   CI :  env: GA_MEASUREMENT_ID: G-XXXXXXXXXX
# Si la valeur est vide, AUCUN script Google Analytics n'est injecté (voir overrides/main.html).
extra:
  analytics:
    provider: google
    property: !ENV [GA_MEASUREMENT_ID, "G-KVQC4X6XB5"]
